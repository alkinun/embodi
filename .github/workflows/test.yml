name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv build

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install headless rendering libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1-mesa-dri
      - run: uv sync --frozen --extra train --extra sim --extra test --extra hardware
      - run: uv run embodi-so101-preflight --canonical-calibration configs/so101-physical-calibration.example.json
      - run: uv run pytest --cov
      - run: uv run embodi-train --smoke-test
      - run: uv run embodi-sim --smoke-test
