name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      # Fixed releases conflict with the pinned Torch, Transformers, and LeRobot compatibility ranges.
      - run: >-
          uv run pip-audit --local --progress-spinner off --skip-editable
          --ignore-vuln PYSEC-2025-194
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3447

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv build

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra train --extra sim --extra test --extra hardware
      - run: uv run embodi-so101-preflight --canonical-calibration configs/so101-physical-calibration.example.json
      - run: uv run pytest -m "not simulation" --cov --cov-report= --cov-fail-under=0
      - run: uv run embodi-train --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: .coverage.unit
          include-hidden-files: true

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_FILE: .coverage.simulation
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install headless rendering libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1-mesa-dri
      - run: uv sync --frozen --extra train --extra sim --extra test --extra hardware
      - run: uv run pytest -m simulation --cov --cov-report= --cov-fail-under=0
      - run: uv run embodi-sim --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-coverage
          path: .coverage.simulation
          include-hidden-files: true

  coverage:
    needs: [pytest, simulation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-coverage"
          path: coverage-data
          merge-multiple: true
      - run: uv run coverage combine coverage-data
      - run: uv run coverage report
