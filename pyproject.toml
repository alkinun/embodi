[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embodi"
version = "0.1.0"
description = "simulation-first vision-language-action policy for so-100 and so-101"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=1.0",
  "torch>=2.4",
  "transformers>=5.1,<5.2",
  "peft>=0.14",
]

[project.optional-dependencies]
train = [
  "h5py>=3.12",
  "lerobot[dataset]==0.6.1",
  "matplotlib>=3.10",
  "accelerate>=1.2",
  "tqdm>=4.67",
  "wandb>=0.19",
]
hardware = [
  "lerobot[dataset,hardware,feetech]==0.6.1",
]
test = [
  "hypothesis>=6,<7",
  "mypy>=1.19,<1.20",
  "pip-audit>=2.9,<3",
  "pytest>=8",
  "pytest-cov>=7,<8",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15,<0.16",
]
sim = [
  "fastapi>=0.116",
  "mujoco>=3.3,<4",
  "pillow>=11",
  "uvicorn>=0.35",
]

[project.scripts]
embodi-train = "embodi.train:main"
embodi-sim = "embodi.sim.cli:main"
embodi-generate = "embodi.sim.data:main"
embodi-preview = "embodi.preview:main"
embodi-convert-so101 = "embodi.convert_so101:main"
embodi-init-so101-calibration = "embodi.physical.calibration:main"
embodi-record-so101 = "embodi.record_so101:main"
embodi-so101-preflight = "embodi.physical.preflight:main"
embodi-validate-benchmark = "embodi.sim.benchmark:main"
embodi-prepare-benchmark = "embodi.sim.benchmark_scenarios:main"
embodi-admit-benchmark = "embodi.sim.benchmark_admission:main"
embodi-generate-benchmark = "embodi.sim.benchmark_data:main"
embodi-train-joint = "embodi.joint_train:main"
embodi-evaluate-benchmark-geometry = "embodi.sim.benchmark_geometry_evaluation:main"
embodi-diagnose-benchmark-geometry = "embodi.sim.benchmark_geometry_diagnostics:main"
embodi-project-benchmark-geometry = "embodi.sim.benchmark_geometry_projection:main"
embodi-align-benchmark-replans = "embodi.sim.benchmark_replan_alignment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/embodi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "simulation: requires the MuJoCo simulation runtime",
]
filterwarnings = ["error"]
timeout = 60
timeout_method = "signal"

[tool.coverage.run]
branch = true
source = ["embodi"]

[tool.coverage.report]
fail_under = 70
precision = 2
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
files = [
  "src/embodi/canonical.py",
  "src/embodi/token_canonical.py",
  "src/embodi/token_config.py",
  "src/embodi/physical/safety.py",
  "src/embodi/sim/morphology.py",
  "src/embodi/sim/tasks.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
